name: kfq-rerun3
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  r3a:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [2, 3, 4, 5, 6, 9, 10, 11, 13, 22, 23, 26, 27, 31, 41, 42, 43, 49, 51, 53, 55, 63, 65, 66, 68, 71, 72, 75, 86, 90, 92, 95, 99, 100, 102, 104, 107, 110, 115, 120, 123, 126, 129, 130, 133, 134, 136, 151, 155, 156, 157, 158, 161, 163, 166, 167, 168, 170, 171, 172, 174, 187, 188, 191, 192, 197, 198, 199, 200, 206, 212, 219]
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: r3a
          BASE: "0"
          SHARD: ${{ matrix.shard }}
          CAP: "240"
          USERS: "admin,administrator,root,firstwxx1"
          DICT: "kfq_dict.txt"
        run: python3 -u kfq_run.py
  r3cd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [2, 4, 7, 9, 10, 11, 14, 17, 18, 19, 20, 37, 39, 51, 52, 53, 57, 58, 67, 68, 69, 77, 80, 83, 84, 88, 91, 93, 100, 101, 103, 104, 105, 107, 109, 110, 114, 120, 123, 125, 126, 127, 129, 135, 137, 141, 142, 143, 150, 152, 153, 155, 158, 159, 160, 161, 162, 168, 169, 170, 172, 174, 175, 178, 179, 180, 186, 188, 194, 200, 204, 209, 211, 213, 215, 216, 217, 219]
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: r3cd
          BASE: "0"
          SHARD: ${{ matrix.shard }}
          CAP: "240"
          USERS: "cddznsn,19022075515,xgift,ceshi"
          DICT: "kfq_dict.txt"
        run: python3 -u kfq_run.py
