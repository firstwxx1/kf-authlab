name: kfq-rerun2
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: [2,3,4,5,6,7,9,10,11,13,22,23,25,26,27,31,33,35,40,41,42,43,44,45,46,49,50,51,53,55,56,57,59,60,63,65,66,67,68,69,70,71,72,75,76,81,85,86,87,90,91,92,93,94,95,99,100,101,102,103,104,107,109,110,112,115,117,120,122,123,124,126,129,130,131,133,134,135,136,139,140,143,149,150,151,153,155,156,157,158,160,161,162,163,165,166,167,168,169,170,171,172,174,177,180,182,183,186,187,188,190,191,192,195,196,197,198,199,200,201,202,203,204,206,207,208,209,211,212,216,218,219,220]
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: rmain2
          BASE: "0"
          SHARD: ${{ matrix.shard }}
          CAP: "240"
          USERS: "admin,administrator,root,firstwxx1"
          DICT: "kfq_dict.txt"
        run: python3 -u kfq_run.py
