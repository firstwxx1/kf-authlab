name: kfq-lock
on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag
        required: false
        default: "lock1"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          python3 -u kfq_lockprobe.py
