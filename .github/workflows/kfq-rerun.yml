name: kfq-rerun
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  rc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [2,4,5,7,9,10,11,14,15,16,17,18,19,20,22,23,31,32,37,38,39,40,42,43,45,50,51,52,53,54,57,58,61,64,67,68,69,72,76,77,78,79,80,83,84,86,87,88,91,93,95,96,98,99,100,101,102,103,104,105,107,108,109,110,111,112,113,114,116,118,119,120,123,124,125,126,127,129,131,134,135,137]
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: rCfix
          BASE: "0"
          SHARD: ${{ matrix.shard }}
          CAP: "240"
          USERS: "cddznsn,19022075515,xgift,ceshi"
          DICT: "kfq_dict.txt"
        run: python3 -u kfq_run.py
  rd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: [2,3,4,7,9,11,13,14,16,17,18,19,20,21,22,23,24,26,27,28,29,30,31,33,34,35,36,38,39,40,41,45,46,47,49,51,55,56,58,59,60,61,65,68,70,72,74,75,76,77,78,80,81]
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: rDfix
          BASE: "139"
          SHARD: ${{ matrix.shard }}
          CAP: "240"
          USERS: "cddznsn,19022075515,xgift,ceshi"
          DICT: "kfq_dict.txt"
        run: python3 -u kfq_run.py
